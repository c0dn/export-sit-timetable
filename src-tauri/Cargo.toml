[package]
name = "export-sit-timetable"
version = "1.0.0"
description = "An app that exports timetable from the website"
authors = ["William"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "export_sit_timetable_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-opener = "2.2.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
scraper = "0.22.0"
chromiumoxide = {version = "0.7.0", default-features = false, features = ["tokio", "tokio-runtime"] }
tokio = {version = "1.40.0"}
chrono = {version = "0.4.39", features = ["serde"] }
futures = "0.3.31"
icalendar = "0.16.10"
tauri-plugin-dialog = "2.2.0"
reqwest = {version = "0.12.11", features = ["rustls-tls", "http2", "brotli", "gzip", "deflate"], default-features = false}
